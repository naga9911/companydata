<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Submissions</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .data-container {
            max-width: 900px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            color: #333;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f1f3f5;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .nav-link {
            color: #4a90e2;
            text-decoration: none;
            font-weight: 500;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .export-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .export-btn:hover {
            background-color: #219a52;
        }
    </style>
</head>
<body>
    <div class="data-container">
        <div class="header-actions">
            <a href="index.html" class="nav-link">&larr; Back to Form</a>
            <button id="exportBtn" class="export-btn">Download Excel (CSV)</button>
        </div>
        
        <h2>Submitted Data</h2>
        
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Address</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody id="dataBody">
                <!-- Data rows will be injected here -->
            </tbody>
        </table>
    </div>

    <!-- Data Logic -->
    <script src="data.js"></script>
</body>
</html>
