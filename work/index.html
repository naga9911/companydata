<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Submit Your Details</h2>
        <a href="data.html" style="display: block; text-align: center; margin-bottom: 20px; color: #4a90e2; text-decoration: none; font-weight: 500;">View Live Submissions</a>
        <form id="dataForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required placeholder="Enter your address">
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" required placeholder="Enter your mobile number">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" required placeholder="Tell us more..."></textarea>
            </div>

            <button type="submit" id="submitBtn">Submit Details</button>
            <p id="successMessage" class="success-message" style="display: none;">Data submitted successfully!</p>
            <p id="errorMessage" class="error-message" style="display: none;">Error submitting data. Check console.</p>
        </form>
    </div>

    <!-- Form Logic -->
    <script src="script.js"></script>
</body>
</html>
