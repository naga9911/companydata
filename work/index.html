<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">Company</div>
        <nav class="nav-buttons">
            <button class="nav-btn">About</button>
            <button class="nav-btn">Data</button>
            <button class="nav-btn">Body</button>
        </nav>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Screen 1 Group -->
            <div class="sidebar-group">
                <button class="sidebar-toggle-btn active">Screen 1 <span class="arrow">▼</span></button>
                <div class="sidebar-dropdown show">
                    <button class="sidebar-btn active" data-target="screen1-1">Sub-screen 1.1</button>
                    <button class="sidebar-btn" data-target="screen1-2">Sub-screen 1.2</button>
                </div>
            </div>

            <!-- Screen 2 Group -->
            <div class="sidebar-group">
                <button class="sidebar-toggle-btn">Screen 2 <span class="arrow">▶</span></button>
                <div class="sidebar-dropdown">
                    <button class="sidebar-btn" data-target="screen2-1">Sub-screen 2.1</button>
                    <button class="sidebar-btn" data-target="screen2-2">Sub-screen 2.2</button>
                </div>
            </div>

            <!-- Screen 3 Group -->
            <div class="sidebar-group">
                <button class="sidebar-toggle-btn">Screen 3 <span class="arrow">▶</span></button>
                <div class="sidebar-dropdown">
                    <button class="sidebar-btn" data-target="screen3-1">Sub-screen 3.1</button>
                    <button class="sidebar-btn" data-target="screen3-2">Sub-screen 3.2</button>
                </div>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="content-area">
            
            <!-- Screen 1.1 Form -->
            <section id="screen1-1" class="screen-section active-screen">
                <h2>Screen 1.1: Personal Details</h2>
                <form class="data-form" data-screen="screen1-1">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="lastName" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Submit</button>
                        <button type="button" class="delete-btn">Delete</button>
                    </div>
                </form>
            </section>

            <!-- Screen 1.2 Form -->
            <section id="screen1-2" class="screen-section">
                <h2>Screen 1.2: Contact Details</h2>
                <form class="data-form" data-screen="screen1-2">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" name="address" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Submit</button>
                        <button type="button" class="delete-btn">Delete</button>
                    </div>
                </form>
            </section>

            <!-- Screen 2.1 Form -->
            <section id="screen2-1" class="screen-section">
                <h2>Screen 2.1: Work Information</h2>
                <form class="data-form" data-screen="screen2-1">
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" name="jobTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" name="department" required>
                    </div>
                    <div class="form-group">
                        <label>Years of Experience</label>
                        <input type="number" name="experience" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Submit</button>
                        <button type="button" class="delete-btn">Delete</button>
                    </div>
                </form>
            </section>

            <!-- Screen 2.2 Form -->
            <section id="screen2-2" class="screen-section">
                <h2>Screen 2.2: Projects</h2>
                <form class="data-form" data-screen="screen2-2">
                    <div class="form-group">
                        <label>Project Name</label>
                        <input type="text" name="projectName" required>
                    </div>
                    <div class="form-group">
                        <label>Role in Project</label>
                        <input type="text" name="role" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Submit</button>
                        <button type="button" class="delete-btn">Delete</button>
                    </div>
                </form>
            </section>

            <!-- Screen 3.1 Form -->
            <section id="screen3-1" class="screen-section">
                <h2>Screen 3.1: Feedback</h2>
                <form class="data-form" data-screen="screen3-1">
                    <div class="form-group">
                        <label>Rating (1-5)</label>
                        <input type="number" name="rating" min="1" max="5" required>
                    </div>
                    <div class="form-group">
                        <label>Comments</label>
                        <textarea name="comments" rows="4" required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Submit</button>
                        <button type="button" class="delete-btn">Delete</button>
                    </div>
                </form>
            </section>

            <!-- Screen 3.2 Form -->
            <section id="screen3-2" class="screen-section">
                <h2>Screen 3.2: Suggestions</h2>
                <form class="data-form" data-screen="screen3-2">
                    <div class="form-group">
                        <label>Feature Request</label>
                        <input type="text" name="featureRequest" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" rows="4" required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Submit</button>
                        <button type="button" class="delete-btn">Delete</button>
                    </div>
                </form>
            </section>

            <!-- Data Table Section -->
            <div class="data-section">
                <div class="data-header">
                    <h3>Submitted Data</h3>
                    <button id="downloadCsvBtn" class="download-btn">Download CSV</button>
                </div>
                <div class="table-container">
                    <table id="dataTable">
                        <thead>
                            <tr id="tableHeaders">
                                <!-- Headers will be dynamically populated -->
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Rows will be dynamically populated -->
                        </tbody>
                    </table>
                </div>
                <p id="noDataMessage" class="no-data">No data available for this screen.</p>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Company Name. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
